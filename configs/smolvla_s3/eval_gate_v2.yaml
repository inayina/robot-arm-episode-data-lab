  canonical_max_frames_per_episode: 0
  require_full_episode_for_pass: true
  canonical_inference_mode: canonical_first_action
  diagnostic_inference_mode: queued_diagnostic
  canonical_executes_action_chunk_queue: false
  queued_diagnostic_gate_eligible: false

prospective_evaluation_contract:
  manifest_contract_version: smolvla_s3_prospective_eval_manifest_v1
  manifest_required_for_pass: true
  require_gate_sha256_match: true
  require_splits_sha256_match: true
  require_manifest_created_after_gate_freeze: true
  require_thresholds_frozen_before_evaluation: true
  require_human_authorized_run: true
  require_evaluation_refs_exact_match: true
  require_zero_train_overlap: true
  require_zero_threshold_design_overlap: true
  forbid_saved_report_reclassification: true
  threshold_design_reports:
    - path: runs/smolvla_s3/openloop_recovery_v3_20260723T142240Z/s3_open_loop_report.json
      sha256: caf22b9e2ccca7476cf39fea28afb0b2b354b24e1828e8d489a4fbc95fe7ccb0
