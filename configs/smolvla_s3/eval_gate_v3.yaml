# SmolVLA S3 Recovery execution-semantics open-loop gate (v3).
#
# Human-approved contract revision of eval_gate_v2, authorized in chat on
# 2026-07-24 ("硬约束也不是不能改，只要最终能在ISAAC上实现就可以了").
#
# Revision rationale (see docs/SMOLVLA_S3_GRIPPER_RANGE_CLIP_AUDIT.md):
# the executed gripper command is clip(raw, 0, 1). Open-edge overshoot
# (raw > 1+eps where the expert command is 1.0 = fully open) clamps to a
# command identical to the expert's, with zero classification change and
# zero close-timing change — both of which remain hard No-Go invariants
# here. v2 gated Pass on pre-clip raw magnitude on both edges, which is a
# model-extrapolation diagnostic, not an execution-safety property. v3
# keeps every execution-safety invariant from v2, keeps the contact-risk
# close-edge bound, and demotes open-edge raw magnitude to report-only
# diagnostics under a wide sanity envelope.
#
# This file does not reclassify any historical v2 report. The 2026-07-24
# v2 prospective result remains Hold under v2. v3 applies prospectively
# only, to fresh inference on episodes with zero overlap with train and
# with the threshold-design refs below (which now include the 10 episodes
# whose v2 result motivated this revision).

