gripper_contract:
  physical_command_range: [0.0, 1.0]
  closed_if_le: 0.5
  close_debounce_source_frames: 3
  gate_metric: gripper_balanced_accuracy
  report_continuous_tolerance: 0.25
  model_output_normalization: MEAN_STD
  postprocessor_behavior: unnormalize_only_no_range_clamp
  execution_adapter_behavior: clamp_to_physical_range

baselines:
  s2_report: evaluation/examples/smolvla_gate_s2_report.json
  s2_ee_rmse_m: 0.2734163848429447
  s2_gripper_accuracy: 0.0

metrics_required:
  - ee_position_rmse_m
  - quaternion_angular_error_rad
  - gripper_balanced_accuracy
  - gripper_close_timing_error_frames
  - action_smoothness_ee_step_l2_p90
  - home_no_close_detected_rate
  - temporal_metrics_gate_eligible
  - raw_gripper_oob_ratio
  - raw_gripper_oob_beyond_epsilon_ratio
  - raw_gripper_oob_beyond_epsilon_open_edge_ratio
  - raw_gripper_oob_beyond_epsilon_close_edge_ratio
  - gripper_clip_adjustment_mae
  - gripper_clip_adjustment_max_abs
  - raw_gripper_min
  - raw_gripper_max
  - gripper_clip_classification_change_ratio
  - gripper_clip_close_timing_change_frames_max_abs
  - mapped_gripper_command_in_range
  - mapped_gripper_matches_clip_max_abs
  - prospective_eval_eligible

gripper_range_severity_contract:
  semantics: execution_side_aware_v3
  epsilon: 0.05
  thresholds:
    # Pass items (execution/contact risk):
    #  - close-edge bound inherits the frozen 1% from v2, restricted to the
    #    side where clamping meets the object (raw < -epsilon).
    #  - mean clip magnitude bound inherited unchanged from v2.
    close_edge_oob_beyond_epsilon_ratio_max: 0.01
    clip_adjustment_mae_max: 0.01
    # No-Go sanity envelope: structural runaway detection, not tuned to data.
    raw_gripper_sanity_min: -0.5
    raw_gripper_sanity_max: 1.5
    # Execution-clip invariants inherited unchanged from v2 (No-Go).
    clip_classification_change_ratio_max: 0.0
    clip_close_timing_change_frames_max: 0
    mapped_gripper_matches_clip_max_abs_max: 0.0000001
  diagnostics_report_only:
    - raw_gripper_oob_ratio
    - raw_gripper_oob_beyond_epsilon_ratio
    - raw_gripper_oob_beyond_epsilon_open_edge_ratio
    - gripper_clip_adjustment_max_abs
    - raw_gripper_min
    - raw_gripper_max

thresholds:
  pass:
    ee_position_rmse_m_max: 0.100
    relative_ee_improvement_vs_s2_min: 0.50
    quaternion_angular_error_rad_max: 0.35
    gripper_balanced_accuracy_min: 0.70
    gripper_close_timing_error_frames_max: 5
    action_smoothness_ee_step_l2_p90_max: 0.05
    home_no_close_detected_max_rate: 0.20
    require_consistent_stage_timing: true
  hold:
    ee_position_rmse_m_max: 0.205
    relative_ee_improvement_vs_s2_min: 0.25
    quaternion_angular_error_rad_max: 0.70
    gripper_balanced_accuracy_min: 0.40
    home_no_close_detected_max_rate: 0.50
    max_data_fix_retries: 1
  no_go:
    ee_position_rmse_m_min: 0.246
    gripper_balanced_accuracy_max: 0.15
    home_no_close_detected_min_rate: 0.80
    near_static_ee_step_l2_p90_max: 0.002
    nan_or_inf_any: true
    mapped_command_out_of_range_any: true
    mapped_command_not_equal_clip_any: true
    clip_classification_change_any: true
    clip_close_timing_change_any: true
    raw_gripper_outside_sanity_envelope_any: true

decision_rules:
  - "Executed command is clip(raw, 0, 1); severity Pass items gate the contact-risk close edge and mean clip magnitude only."
  - "Open-edge raw overshoot is report-only diagnostics inside the [-0.5, 1.5] sanity envelope; outside the envelope is No-Go."
  - "Mapped command range/mismatch or clip classification/timing changes remain No-Go."
  - "Missing/non-finite severity metrics fail closed."
  - "Pass requires canonical stride=1, full episodes, and an eligible prospective manifest with zero train/design overlap (design refs include the v2 prospective 10)."
  - "Queued diagnostics and saved historical reports cannot Pass; v2 historical decisions are not reclassified."
  - "A v3 open-loop Pass is only an Isaac-readiness candidate; Isaac still needs separate human approval."
