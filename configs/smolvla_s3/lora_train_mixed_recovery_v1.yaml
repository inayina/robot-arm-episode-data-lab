# Formal mixed release: existing dual-camera train split + policy-visited recovery.
# Train only after REAL GPU preflight Pass. This config does not authorize Isaac.

contract_version: smolvla_s3_mixed_recovery_v1_peft_v0
status: configured_for_formal_train
experiment_id: smolvla_s3_mixed_recovery_v1
release_id: smolvla_s3_mixed_recovery_v2_20260821T
release_manifest: data/releases/smolvla_s3_mixed_recovery_v2_20260821T/manifest.json
policy_action_semantics: absolute_eef_gripper_v0
quaternion_order: xyzw
claims_task_success: false
authorized_to_train: true
authorized_isaac: false
visual_allowlist_variant: B_scene_wrist
number_of_policy_cameras: 2

base_checkpoint:
  model_id: lerobot/smolvla_base
  revision: main
  revision_pin_rule: "Set SMOLVLA_BASE_REVISION to the exact cached 40-hex commit."
  local_dir_env: SMOLVLA_BASE_DIR

environment_lock:
  file: configs/smolvla_s3/environment.lock.txt
  notes: "Use the REAL preflight-qualified AutoDL stack; LeRobot 0.5.1."

dependency_versions_expected:
  lerobot: ">=0.5.1,<0.6"
  torch: ">=2.0,<2.8"
  transformers: ">=4.40"
  peft: ">=0.18,<0.20"
  python: ">=3.12"

peft:
  method_type: LORA
  r: 64
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  target_modules: >-
    (model\.vlm_with_expert\.lm_expert\..*\.(q|v)_proj|model\.(state_proj|action_in_proj|action_out_proj|action_time_mlp_in|action_time_mlp_out))
  full_training_modules: []

freeze:
  strategy: official_smolvla_peft_regex
  train_base_weights: false
  train_vision_encoder: false
  freeze_base_vlm: true

state_contract:
  name: observation.state[15]
  dim: 15
  layout:
    - joint_position[7]
    - ee_pose_xyzw[7]
    - measured_gripper[1]
  exclude_from_policy_state:
    - observation.object_pose
    - observation.ft
  pads_to_max_state_dim: 32

train_budget_candidate:
  action_chunk_size: 10
  inference_action_steps_initial: 5
  effective_epochs_initial: 5
  train_frames: 12071
  notes: "7545 = ceil(12071 / batch_size 8) * 5 epochs."

train:
  seed: 42
  batch_size: 8
  gradient_accumulation_steps: 1
  precision: bf16
  learning_rate: 1.0e-3
  lr_scheduler: cosine
  lr_warmup_steps: 50
  weight_decay: 1.0e-4
  max_steps: 7545
  logging_steps: 10
  eval_every_steps: 100
  save_every_steps: 100
  max_grad_norm: 1.0
  dataloader_workers: 2
  action_chunk_size: 10
  entrypoint: lerobot-train
  no_architecture_change: true
  no_new_loss: true
  no_auto_hparam_search: true

inference:
  action_steps: 5
  empty_cameras: 0
  camera_variant: scene_plus_wrist
  canonical_mode: canonical_first_action
  diagnostic_mode: queued_diagnostic
  async_double_buffer: false
  notes: "Exactly scene→camera1 and wrist→camera2; missing wrist fails closed."

output:
  root: runs/smolvla_s3_mixed_recovery_v1
  run_id_template: "{experiment_id}_{timestamp_utc}"
  require_fresh_dir: true
  save_optimizer: true
  save_lora_adapters: true

eval_gate_config: configs/smolvla_s3/eval_gate_v3.yaml

gates:
  require_preflight_pass: true
  require_human_confirm_for_full_train: true
  forbid_auto_start_train_from_preflight: true
  require_phase0_split_materialization_pass: true
  require_visual_allowlist_pass: true
  require_dual_camera_preflight_pass: true
  require_dependency_version_match: true
  require_preflight_config_sha256_match: true
  forbid_auto_train: true
  forbid_isaac: true
