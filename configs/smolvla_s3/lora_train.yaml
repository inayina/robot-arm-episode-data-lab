# SmolVLA S3 canonical LoRA train config (frozen for AutoDL)
# Official PEFT path only: no architecture change, no new loss, no HP search.
#
# Status: local S3 Ready freeze. Real GPU training requires human approval
# after successful S3 preflight. Does not claim task success.

contract_version: smolvla_s3_lora_config_v0
experiment_id: smolvla_s3_lora_abs_eef_rgb_v0
release_id: smolvla_s3_abs_eef_rgb_v0
release_manifest: data/releases/smolvla_s3_abs_eef_rgb_v0/manifest.json
policy_action_semantics: absolute_eef_gripper_v0
quaternion_order: xyzw

base_checkpoint:
  model_id: lerobot/smolvla_base
  # Pin at AutoDL download time; do not float to latest without re-freeze.
  revision: main  # preflight-bound: replace with exact commit SHA after first successful download
  revision_pin_rule: "After first AutoDL download, record commit SHA into this field and re-hash."
  local_dir_env: SMOLVLA_BASE_DIR
  default_local_hint: checkpoints/smolvla_base_s3

environment_lock:
  file: configs/smolvla_s3/environment.lock.txt
  notes: "Install via scripts/autodl_setup_smolvla_s3.sh into a fresh conda/venv; never system Python."

dependency_versions_expected:
  # Align with configs/smolvla_s3/environment.lock.txt (AutoDL may lack 0.5.2 on mirrors).
  # The formal entry and checkpoint audit target the verified 0.5.x CLI/schema.
  lerobot: ">=0.5.1,<0.6"
  torch: ">=2.0,<2.8"  # preflight-bound within CUDA wheel family
  transformers: ">=4.40"
  peft: ">=0.11,<0.16"
  python: ">=3.12"  # lerobot>=0.5.0 requires >=3.12; 3.10/3.11 cannot install

peft:
  method_type: LORA
  # Official SmolVLA / LeRobot PEFT defaults (r=64). Explicit alpha avoids silent dampening.
  r: 64
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  # Typical decoder attention projections; do not expand without re-freeze.
  target_modules:
    - q_proj
    - v_proj
  # If official entrypoint exposes different names, preflight must fail closed and report.

freeze:
  strategy: peft_lora_only
  train_base_weights: false
  train_vision_encoder: false  # LoRA adapters only unless official recipe requires otherwise
  notes: "No full fine-tune. No new heads."

train:
  seed: 42
  # Effective batch = batch_size * grad_accum. Keep ≤8 unless preflight proves VRAM headroom.
  batch_size: 4  # preflight-bound allowed set: {1, 2, 4, 8}
  gradient_accumulation_steps: 1  # preflight-bound allowed set: {1, 2, 4}
  precision: bf16  # preflight-bound allowed set: {bf16, fp16}
  learning_rate: 1.0e-3
  lr_scheduler: cosine
  lr_warmup_steps: 50
  weight_decay: 1.0e-4
  max_steps: 1000
  logging_steps: 10
  eval_every_steps: 100
  save_every_steps: 200
  max_grad_norm: 1.0
  dataloader_workers: 2  # preflight-bound allowed set: {0, 2, 4}
  action_chunk_size: 50
  # Official entry: prefer `lerobot-train` + --policy.path=lerobot/smolvla_base --peft.*
  entrypoint: lerobot-train
  no_architecture_change: true
  no_new_loss: true
  no_auto_hparam_search: true

resume:
  allowed: true
  rule: "Resume only from checkpoints under the same output_dir run_id. Never resume across release_id or config hash mismatch."
  require_matching_config_sha256: true

output:
  root: runs/smolvla_s3
  run_id_template: "{experiment_id}_{timestamp_utc}"
  require_fresh_dir: true
  save_optimizer: true
  save_lora_adapters: true

logging:
  stdout: true
  jsonl: train_log.jsonl
  metadata_json: run_metadata.json
  resource_sample_seconds: 30
  capture: [gpu_name, vram_peak_mib, step_time_ms, torch_version, cuda_version, peft_version]

gates:
  require_preflight_pass: true
  require_human_confirm_for_full_train: true
  forbid_auto_start_train_from_preflight: true
  forbid_isaac_until_open_loop_pass: true
  forbid_overwrite_s2_evidence: true

eval_gate_config: configs/smolvla_s3/eval_gate.yaml
