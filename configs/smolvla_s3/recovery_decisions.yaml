state_contract:
  name: observation.state[15]
  status: adopted_for_v3_recovery
  layout:
    - joint_position[7]          # observation.state from recorder
    - ee_pose_xyzw[7]            # observation.ee_pose (FK / runtime; not sim GT)
    - measured_gripper[1]        # observation.gripper
  exclude_from_policy_state:
    - observation.object_pose    # sim privilege; breaks Sim2Real-readiness
    - observation.ft             # needs real sync/calibration first
  pads_to_max_state_dim: 32
  upstream_evidence: src/lerobot_recorder/lerobot_recorder/recorder_node.py:341
  notes: >
    v1/v2 checkpoints declared observation.state[6] while release joint state is [7]
    and ee_pose/gripper were dropped by the preprocessor. Recovery v3 must compose
    state[15] explicitly into dataset + preprocessor before any new LoRA.

peft:
  status: adopted_for_v3_recovery
  method_type: LORA
  r: 64
  lora_alpha: 64
  lora_dropout: 0.05
  bias: none
  # Official SmolVLA default PEFT scope on pinned LeRobot 0.5.x
  # (modeling_smolvla.SmolVLAPolicy._get_default_peft_targets).
  target_modules: >-
    (model\.vlm_with_expert\.lm_expert\..*\.(q|v)_proj|model\.(state_proj|action_in_proj|action_out_proj|action_time_mlp_in|action_time_mlp_out))
  full_training_modules: []
  freeze_vision_encoder: true
  freeze_base_vlm: true
  rejected_alternatives:
    - plain_list_qv_and_projections  # suffix match can hit vision/language towers
    - qv_lora_plus_full_training_modules  # small-data overfitting risk; departs from official default

