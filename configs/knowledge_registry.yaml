schema_version: 1

repositories:
  - name: ros2-arm-teleoperation-suite
    role: upstream
    path: ../ros2-arm-teleoperation-suite
    path_env: ROS2_ARM_TELEOP_REPO
    fallback_paths:
      - /home/ina/dev/ros2-arm-teleoperation-suite
    required: true
  - name: robot-arm-episode-data-lab
    role: midstream
    path: .
    required: true
  - name: ros2-moveit-pybullet-bridge
    role: downstream
    path: ../ros2-moveit-pybullet-bridge
    path_env: ROS2_MOVEIT_PYBULLET_BRIDGE_REPO
    fallback_paths:
      - /home/ina/ros2_ws/src/ros2-moveit-pybullet-bridge
    required: true

exclude_dirs: [.git, .venv, build, install, log, node_modules, dataset, checkpoints, __pycache__]
max_file_size_bytes: 1000000

# Rules are first-match. Exact overrides below always win.
rules:
  # Upstream tests, implementation, configuration and documentation.
  - repository: ros2-arm-teleoperation-suite
    globs: [tests/**/*.py, src/**/test/**/*.py]
    kind: test
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 100
    authoritative_for: []
    component: [upstream_collection]
    tags: [pytest, upstream]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [docs/archive/**/*.md]
    kind: archive
    status: archive
    enabled_modes: []
    evidence_priority: 5
    authoritative_for: []
    component: []
    tags: [archive]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [docs/portfolio/**/*.md]
    kind: portfolio
    status: derivative
    enabled_modes: [portfolio]
    evidence_priority: 35
    authoritative_for: []
    component: [canonical_evidence]
    tags: [portfolio, upstream]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [docs/SPEC*.md, docs/*ROADMAP*.md, docs/*spec*.md]
    kind: spec
    status: historical
    enabled_modes: [debug, learning]
    evidence_priority: 20
    authoritative_for: []
    component: [upstream_collection]
    tags: [design, upstream]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [docs/ros2_env_and_packages_guide.md]
    kind: reference
    status: current
    enabled_modes: [learning]
    evidence_priority: 25
    authoritative_for: []
    component: []
    tags: [learning, ros2]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [.agents/skills/**/*.md]
    kind: reference
    status: current
    enabled_modes: [debug, learning]
    evidence_priority: 25
    authoritative_for: []
    component: [upstream_collection]
    tags: [agent_skill, learning, upstream]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [bin/*, scripts/**/*.py, src/**/*.py, "**/*.launch.py"]
    kind: code
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 90
    authoritative_for: []
    component: [upstream_collection]
    tags: [python, upstream]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [src/**/*.cpp, src/**/*.hpp]
    kind: code
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 90
    authoritative_for: []
    component: [upstream_collection]
    tags: [cpp, upstream]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [src/**/*.yaml, config/**/*.yaml, "**/msg/*.msg", "**/srv/*.srv"]
    kind: config
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 85
    authoritative_for: []
    component: [data_schema, upstream_collection]
    tags: [config, interface, tuning]
    last_verified: 2026-07-14
  - repository: ros2-arm-teleoperation-suite
    globs: [README.md, docs/**/*.md]
    kind: current_doc
    status: current
    enabled_modes: [fact, debug, runbook, learning, portfolio]
    evidence_priority: 65
    authoritative_for: []
    component: [upstream_collection]
    tags: [documentation, upstream]
    last_verified: 2026-07-14

  # Midstream boundaries: legacy/archive/reference/portfolio are isolated first.
  - repository: robot-arm-episode-data-lab
    globs: [tests/**/*.py]
    kind: test
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 100
    authoritative_for: []
    component: [data_schema, dataset_adapter, training, handoff]
    tags: [pytest, midstream]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [docs/archive/**/*.md]
    kind: archive
    status: archive
    enabled_modes: []
    evidence_priority: 5
    authoritative_for: []
    component: []
    tags: [archive]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [docs/legacy_pybullet/**/*.md, docs/dev/**/*.md, archive/**/*.md, agents/**/*.py, core/**/*.py]
