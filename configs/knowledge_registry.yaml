    kind: spec
    status: draft
    enabled_modes: [debug, learning]
    evidence_priority: 20
    authoritative_for: []
    component: [canonical_evidence]
    tags: [design, draft]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [docs/portfolio/**/*.md]
    kind: portfolio
    status: derivative
    enabled_modes: [portfolio]
    evidence_priority: 35
    authoritative_for: []
    component: [canonical_evidence]
    tags: [portfolio]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [evidence/**/*.json, training/reports/**/*.json, data/exports/**/manifest.json, data/exports/**/inspection_report.json, docs/portfolio/**/*.json]
    kind: run_artifact
    status: current
    enabled_modes: [fact, debug, portfolio]
    evidence_priority: 98
    authoritative_for: [canonical_evidence]
    component: [canonical_evidence, training, handoff]
    tags: [artifact, local_untracked]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [configs/**/*.yaml, training/configs/**/*.yaml]
    kind: config
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 85
    authoritative_for: [data_schema]
    component: [data_schema]
    tags: [config, schema]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [data/exports/README.md]
    kind: current_doc
    status: current
    enabled_modes: [fact, debug, runbook]
    evidence_priority: 65
    authoritative_for: []
    component: [data_schema]
    tags: [dataset_release, documentation]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [skills/**/*.md]
    kind: runbook
    status: current
    enabled_modes: [debug, runbook]
    evidence_priority: 60
    authoritative_for: []
    component: [data_schema, dataset_adapter, training, handoff]
    tags: [agent_skill, runbook]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [bin/*, project_knowledge/**/*.py, training/**/*.py, scripts/**/*.py]
    kind: code
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 90
    authoritative_for: []
    component: [dataset_adapter, training, handoff]
    tags: [python, midstream]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [docs/CLOSED_LOOP_RUNBOOK.md, docs/DEMO_GUIDE.md, docs/TROUBLESHOOTING.md]
    kind: runbook
    status: current
    enabled_modes: [debug, runbook]
    evidence_priority: 60
    authoritative_for: []
    component: [training, handoff, canonical_evidence]
    tags: [runbook]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    globs: [README.md, AGENTS.md, training/README_TRAINING.md, docs/**/*.md]
    kind: current_doc
    status: current
    enabled_modes: [fact, debug, runbook, learning, portfolio]
    evidence_priority: 65
    authoritative_for: []
    component: [data_schema, dataset_adapter, training, handoff]
    tags: [documentation, midstream]
    last_verified: 2026-07-14

  # Downstream current Panda replay and risk implementation.
  - repository: ros2-moveit-pybullet-bridge
    globs: ["*/test/**/*.py"]
    kind: test
    status: current
    enabled_modes: [fact, debug, runbook, portfolio]
    evidence_priority: 100
    authoritative_for: []
    component: [downstream_replay, risk_monitoring]
    tags: [pytest, downstream]
    last_verified: 2026-07-14
  - repository: ros2-moveit-pybullet-bridge
    globs: [docs/archive/**/*.md]
    kind: archive
    status: archive
    enabled_modes: []
    evidence_priority: 5
    authoritative_for: []
    component: []
    tags: [archive]
    last_verified: 2026-07-14
  - repository: ros2-moveit-pybullet-bridge
    globs: [docs/portfolio/**/*.md, docs/*PORTFOLIO*.md]
    kind: portfolio
    status: derivative
    enabled_modes: [portfolio]
    evidence_priority: 35
    authoritative_for: []
