overrides:
  - repository: robot-arm-episode-data-lab
    path: docs/portfolio/THREE_REPO_CANONICAL_FACTS.md
    kind: canonical
    status: current
    enabled_modes: [fact, debug, portfolio]
    evidence_priority: 80
    authoritative_for: [repository_roles, canonical_evidence, act_training_status]
    component: [canonical_evidence, training]
    tags: [panda, three_repo, canonical]
    depends_on:
      - evidence/downstream/benchmark_summary.json
      - training/reports/panda_mlp_bc/mlp_metrics.json
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    path: docs/portfolio/CANONICAL_EXPERIMENT.md
    kind: portfolio
    status: derivative
    enabled_modes: [debug, portfolio]
    evidence_priority: 35
    authoritative_for: []
    component: [canonical_evidence]
    tags: [panda, scoped_summary]
    depends_on: [evidence/downstream/benchmark_summary.json]
    last_verified: 2026-07-14
  - repository: robot-arm-episode-data-lab
    path: evidence/downstream/benchmark_summary.json
    kind: run_artifact
    status: current
    enabled_modes: [fact, debug, portfolio]
    evidence_priority: 98
    authoritative_for: [latest_downstream_smoke]
    component: [canonical_evidence, downstream_replay]
    tags: [artifact, no_fault, one_episode_smoke]
    depends_on: [evidence/meta/run_summary.json]
    last_verified: 2026-07-13
  - repository: robot-arm-episode-data-lab
    path: docs/specs/PROJECT_EVIDENCE_AGENT_V1.md
    kind: spec
    status: draft
