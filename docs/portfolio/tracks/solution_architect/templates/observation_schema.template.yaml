template_version: 1
schema_id: "<observation schema id>"
robot: "<robot embodiment>"
features:
  - key: observation.state
    dtype: float32
    shape: [15]
    semantic_order:
      - joint_position_0_to_6
      - ee_pose_xyz_quaternion_xyzw
      - gripper_scalar
    units: "rad,m,unitless"
    normalization: "<method and statistics artifact>"
  - key: observation.images.scene
    dtype: uint8
    shape: [3, 240, 320]
    color_order: RGB
    required: true
timing:
  sampling_hz: "<positive number>"
  timestamp_clock: "<clock source>"
  maximum_age_ms: "<positive integer>"
missing_feature_policy: reject
unknown_feature_policy: reject
